spring.application.name=rideconnect

spring.datasource.username=postgres
spring.datasource.password=theo123
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.url=jdbc:postgresql://localhost:5432/rideconnect
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

server.port=9090
server.error.include-message=always
server.error.include-binding-errors=always
server.compression.enabled=true

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
jwt.refresh-expiration=604800000

mobile-money.api-url=${MOBILE_MONEY_API_URL:https://api.mobilemoney.com}
mobile-money.api-key=${MOBILE_MONEY_API_KEY:your-api-key}
mobile-money.callback-url=${MOBILE_MONEY_CALLBACK_URL:http://localhost:8080/api/v1/payments/callback}

maps.api-key=${MAPS_API_KEY:your-mapbox-api-key}
maps.base-url=https://api.mapbox.com

sms.api-url=${SMS_API_URL:https://api.sms-provider.com}
sms.api-key=${SMS_API_KEY:your-sms-api-key}
sms.sender-id=RideConnect

firebase.credentials-path=${FIREBASE_CREDENTIALS_PATH:classpath:firebase-credentials.json}

app.base-fare.motorcycle=500.0
app.base-fare.car=1000.0
app.base-fare.van=1500.0

app.per-km-rate.motorcycle=200.0
app.per-km-rate.car=400.0
app.per-km-rate.van=600.0

app.commission-rate=0.15
app.surge-multiplier=1.5
app.max-driver-search-radius=10.0
app.ride-request-timeout=300

logging.level.root=INFO
logging.level.com.rideconnect=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

logging.file.name=logs/rideconnect.log
logging.file.max-size=10MB
logging.file.max-history=30

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
